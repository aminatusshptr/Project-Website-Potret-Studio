    <style>
    /* =============================== */
    /* 🌸 GLOBAL SETTINGS */
    body {
        background-color: #fff0f6; /* pastel pink lembut */
        font-family: 'Quicksand', 'Poppins', sans-serif;
        color: #333;
        margin: 0;
        padding: 0;
        scroll-behavior: smooth;
    }

    /* =============================== */
    /* 🌈 NAVBAR */
    .navbar {
        transition: all 0.3s ease;
        background: linear-gradient(90deg, #ffd6e0, #a6c1ee); /* pastel gradient */
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        border-radius: 0 0 15px 15px;
    }

    .navbar.scrolled {
        background-color: #fff !important;
        box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }

    /* Navbar links cute hover */
    .navbar-nav .nav-link {
        color: #333 !important;
        font-weight: 600;
        transition: all 0.3s ease;
    }
    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link.active {
        color: #ff6f91 !important;
        transform: scale(1.1);
    }

    /* =============================== */
    /* 🖼️ HERO SECTION */
    .hero-section {
        background: linear-gradient(to right, #e8f5e9, #fff0f6); /* pastel green ke pink */
        padding: 6rem 2rem 4rem;
        text-align: center;
        border-radius: 20px;
    }

    .hero-section h1 {
        font-weight: 700;
        color: #ff4d6d;
        font-size: 2.8rem;
        margin-bottom: 1rem;
    }

    .hero-section p {
        font-size: 1.1rem;
        color: #555;
        margin-bottom: 2rem;
    }

    /* =============================== */
    /* 💚 BUTTONS */
    .btn-pastel {
        background: linear-gradient(90deg, #ffd6e0, #a6c1ee);
        color: #fff;
        border: none;
        border-radius: 50px;
        padding: 10px 25px;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .btn-pastel:hover {
        background: linear-gradient(90deg, #a6c1ee, #ffd6e0);
        transform: translateY(-3px) scale(1.05);
    }

    /* =============================== */
    /* 📸 GALLERY */
    .gallery-img {
        border-radius: 20px;
        transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .gallery-img:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 25px rgba(255,182,193,0.25);
    }

    /* =============================== */
    /* 📘 FOOTER */
    footer {
        background: linear-gradient(90deg, #ffd6e0, #a6c1ee); /* pastel gradient */
        color: #333;
        padding: 2rem 0;
        text-align: center;
        font-weight: 600;
        border-radius: 15px 15px 0 0;
    }

    footer a {
        color: #333;
        text-decoration: none;
        font-weight: 600;
    }
    footer a:hover {
        opacity: 0.7;
    }

    /* =============================== */
    /* 📱 RESPONSIVE */
    @media (max-width: 768px) {
        .hero-section {
            padding: 4rem 1rem 3rem;
        }

        .hero-section h1 {
            font-size: 2.2rem;
        }

        .gallery-img {
            width: 100%;
            margin-bottom: 15px;
        }
    }
    </style>

</head>
